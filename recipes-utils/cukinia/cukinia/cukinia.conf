#!/bin/sh
# =============================================================================
# cukinia.conf — TRIK Controller Board (DA850/OMAP-L138, ARMv5, Linux 4.14)
#
# Formal specification of a correctly ported TRIK system.
# This file is sourced by cukinia as a plain POSIX shell script.
#


# =============================================================================
cukinia_log "━━━━ 1. LINUX KERNEL ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
# =============================================================================

# The TRIK board ships with a vendor-patched 4.14 LTS kernel.
# Major.minor check only — patch level is allowed to vary between builds.
as "Kernel version is 4.14" \
    cukinia_kversion 4.14

# --- IIO subsystem ---
# Required for accelerometer (MMA8451) and gyroscope (L3GD20?) support.
as "IIO subsystem enabled (CONFIG_IIO=y)" \
    cukinia_kconf IIO y

as "IIO buffer support enabled (CONFIG_IIO_BUFFER=y)" \
    cukinia_kconf IIO_BUFFER y

# Triggered buffer is used to stream sensor data into /dev/iio:deviceN.
as "IIO triggered buffer enabled (CONFIG_IIO_TRIGGERED_BUFFER=y)" \
    cukinia_kconf IIO_TRIGGERED_BUFFER y

# --- I2C subsystem ---
# Two Davinci I2C buses are used: i2c-1 (camera) and i2c-2 (sensors/motors).
as "I2C subsystem enabled (CONFIG_I2C=y)" \
    cukinia_kconf I2C y

# Character device interface required for userspace i2cdetect / i2ctransfer.
as "I2C character device enabled (CONFIG_I2C_CHARDEV=y)" \
    cukinia_kconf I2C_CHARDEV y

as "TI Davinci I2C driver enabled (CONFIG_I2C_DAVINCI=y)" \
    cukinia_kconf I2C_DAVINCI y

# --- SPI subsystem ---
# SPI-1 carries the L3GD20? gyroscope.
as "SPI subsystem enabled (CONFIG_SPI=y)" \
    cukinia_kconf SPI y

as "TI Davinci SPI driver enabled (CONFIG_SPI_DAVINCI=y)" \
    cukinia_kconf SPI_DAVINCI y

# --- GPIO ---
# Sysfs interface used by trikRuntime init script to configure GPIO pins.
as "GPIO sysfs interface enabled (CONFIG_GPIO_SYSFS=y)" \
    cukinia_kconf GPIO_SYSFS y

# --- PWM ---
# 5 PWM chips (3x ECAP + 2x EHRPWM) drive 6 servo outputs (S1-S6).
as "PWM subsystem enabled (CONFIG_PWM=y)" \
    cukinia_kconf PWM y

as "PWM sysfs interface enabled (CONFIG_PWM_SYSFS=y)" \
    cukinia_kconf PWM_SYSFS y

# ECAP (Enhanced Capture) PWM — drives servo ports S1, S2, S3.
as "TI ECAP PWM driver enabled (CONFIG_PWM_TIECAP=y)" \
    cukinia_kconf PWM_TIECAP y

# EHRPWM (Enhanced High-Resolution PWM) — drives servo ports S4, S5, S6.
as "TI EHRPWM driver enabled (CONFIG_PWM_TIEHRPWM=y)" \
    cukinia_kconf PWM_TIEHRPWM y

# --- DSP / remoteproc ---
# The C674x DSP runs as a remote processor. Communication via virtio/rpmsg.
# Both are built as loadable modules (=m), loaded early in boot.
as "remoteproc framework built as module (CONFIG_REMOTEPROC=m)" \
    cukinia_kconf REMOTEPROC m

as "rpmsg framework built as module (CONFIG_RPMSG=m)" \
    cukinia_kconf RPMSG m

# --- General kernel features ---
as "Loadable module support enabled (CONFIG_MODULES=y)" \
    cukinia_kconf MODULES y

# IKCONFIG_PROC exposes /proc/config.gz — required for kconf tests above.
as "Kernel config accessible via /proc/config.gz (CONFIG_IKCONFIG_PROC=y)" \
    cukinia_kconf IKCONFIG_PROC y

as "ALSA sound subsystem enabled (CONFIG_SOUND=y)" \
    cukinia_kconf SOUND y

# --- Wireless ---
# CFG80211 and MAC80211 are needed by both the internal wl12xx and USB.
as "CFG80211 wireless configuration API enabled (CONFIG_CFG80211=y)" \
    cukinia_kconf CFG80211 y

as "MAC80211 802.11 stack enabled (CONFIG_MAC80211=y)" \
    cukinia_kconf MAC80211 y

# CMA provides contiguous DMA memory — required by the DSP and video subsystem.
as "Contiguous Memory Allocator enabled (CONFIG_CMA=y)" \
    cukinia_kconf CMA y

# --- USB ---
as "USB support enabled (CONFIG_USB=y)" \
    cukinia_kconf USB y

# UVC driver handles USB webcams when the OV7670 MIPI camera is not connected.
as "USB Video Class (UVC) driver enabled (CONFIG_USB_VIDEO_CLASS=y)" \
    cukinia_kconf USB_VIDEO_CLASS y


# =============================================================================
cukinia_log "━━━━ 2. KERNEL MODULES ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
# =============================================================================

# --- Internal WiFi: TI WiLink wl12xx (SDIO interface) ---
# wlan0 — connects to infrastructure networks via wpa_supplicant.
as "wl12xx module loaded (internal WiFi chip)" \
    cukinia_kmod wl12xx

as "wlcore module loaded (WiLink core stack)" \
    cukinia_kmod wlcore

as "wlcore_sdio module loaded (SDIO bus glue)" \
    cukinia_kmod wlcore_sdio

# --- DSP / remoteproc stack ---
# da8xx_remoteproc: platform driver that manages the C674x DSP lifecycle.
as "da8xx_remoteproc module loaded (DSP platform driver)" \
    cukinia_kmod da8xx_remoteproc

as "remoteproc module loaded (generic remote processor framework)" \
    cukinia_kmod remoteproc

# virtio transport layer used for DSP <-> ARM shared memory communication.
as "virtio module loaded" \
    cukinia_kmod virtio

as "virtio_ring module loaded (virtio descriptor ring)" \
    cukinia_kmod virtio_ring

as "virtio_rpmsg_bus module loaded (virtio rpmsg transport)" \
    cukinia_kmod virtio_rpmsg_bus

as "rpmsg_core module loaded (rpmsg channel management)" \
    cukinia_kmod rpmsg_core

as "rpmsg_proto module loaded (rpmsg character device protocol)" \
    cukinia_kmod rpmsg_proto

# --- Ultrasonic distance sensors ---
# HC-SR04 driver exposes sensor events via /dev/input/event1..3.
as "hcsr04 module loaded (ultrasonic sensors D1/D2/D3)" \
    cukinia_kmod hcsr04

# --- Camera ---
# OV7670 is the MIPI camera module. Loaded even when camera is unplugged.
as "ov7670 module loaded (OmniVision camera driver)" \
    cukinia_kmod ov7670

# --- Bluetooth ---
# hci_uart provides the HCI UART transport for the onboard BT chip.
as "hci_uart module loaded (Bluetooth UART transport)" \
    cukinia_kmod hci_uart


# =============================================================================
cukinia_log "━━━━ 3. PROCESSES ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
# =============================================================================

# SSH daemon — required for remote access and deployment.
as "SSH daemon running (sshd)" \
    cukinia_process sshd

# wpa_supplicant manages the wlan0 association to the infrastructure network.
as "WiFi client running (wpa_supplicant on wlan0)" \
    cukinia_process wpa_supplicant

# udhcpc is the BusyBox DHCP client; obtains IP for wlan0.
as "DHCP client running (udhcpc on wlan0)" \
    cukinia_process udhcpc

# X.Org server drives the onboard LCD display (TILCDC framebuffer).
as "X server running (Xorg)" \
    cukinia_process Xorg

# Matchbox is a lightweight window manager designed for embedded/single-app use.
as "Window manager running (matchbox-window-manager)" \
    cukinia_process matchbox-window-manager

# trikGui is the main TRIK runtime GUI — the primary user-facing application.
as "trikGui running (main TRIK GUI application)" \
    cukinia_process trikGui

# mjpg_streamer serves the camera feed over HTTP (port 8080 by default).
as "MJPG streamer running (camera HTTP stream)" \
    cukinia_process mjpg_streamer

# lighttpd provides the TRIK web interface.
as "lighttpd web server running" \
    cukinia_process lighttpd

# Samba allows Windows hosts to browse the TRIK filesystem over the network.
as "Samba file server running (smbd)" \
    cukinia_process smbd

# D-Bus is the IPC backbone for bluetoothd, avahi, and other services.
as "D-Bus daemon running" \
    cukinia_process dbus-daemon

# NTP keeps the system clock synchronized.
as "NTP daemon running (ntpd)" \
    cukinia_process ntpd

# Avahi provides mDNS/DNS-SD — allows discovery as trik-XXXXXX.local.
as "Avahi mDNS daemon running" \
    cukinia_process avahi-daemon

# haveged feeds the kernel entropy pool — important on headless/embedded systems.
as "haveged entropy daemon running" \
    cukinia_process haveged

# The gamepad service streams joystick events via netcat on TCP port 4444.
as "Gamepad service (nc) listening on port 4444" \
    cukinia_process nc

# System logger.
as "Syslog daemon running (syslogd)" \
    cukinia_process syslogd


# =============================================================================
cukinia_log "━━━━ 4. NETWORKING ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
# =============================================================================

# wlan0 is the primary network interface (internal wl12xx chip).
as "wlan0 interface is UP (internal WiFi)" \
    cukinia_netif_is_up wlan0

# Must have a dynamic IPv4 address assigned by the campus/lab DHCP server.
as "wlan0 has an IPv4 address" \
    cukinia_netif_has_ip wlan0 -4

# TCP port 22 must be open for SSH access.
as "TCP port 22 open (SSH)" \
    cukinia_listen4 tcp 22

# TCP port 4444 is used by the gamepad service (netcat listener).
as "TCP port 4444 open (gamepad service)" \
    cukinia_listen4 tcp 4444


# =============================================================================
cukinia_log "━━━━ 5. I2C BUSES ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
# =============================================================================

# --- I2C bus 1 (i2c_davinci.1) ---
# Carries only the OV7670 camera module at address 0x21.
as "I2C bus 1 present in sysfs" \
    cukinia_i2c 1

# The device shows as UU (bound to ov7670 driver) when camera is plugged in.
as "OV7670 camera on I2C-1 address 0x21" \
    cukinia_i2c 1 0x21

# --- I2C bus 2 (i2c_davinci.2) ---
# Main sensor/peripheral bus. Carries multiple devices.
as "I2C bus 2 present in sysfs" \
    cukinia_i2c 2

# MMA8451 accelerometer — also the IIO trigger source for iio:device0.
as "MMA8451 accelerometer on I2C-2 address 0x1c (iio:device0)" \
    cukinia_i2c 2 0x1c

# TLV320AIC3x audio codec — used by the ALSA DA850 TRIK sound card.
as "TLV320AIC3x audio codec on I2C-2 address 0x18" \
    cukinia_i2c 2 0x18

# Address 0x21 on bus 2 — present in sysfs as 2-0021.
as "I2C-2 device at address 0x21" \
    cukinia_i2c 2 0x21

# 0x50 is typically an EEPROM (AT24C or compatible).
as "EEPROM on I2C-2 address 0x50" \
    cukinia_i2c 2 0x50

# MSP430 motor controller — receives commands from the DSP via remoteproc/rpmsg,
# also directly accessible from userspace as the trikRuntime i2c device 0x48.
as "MSP430 motor controller on I2C-2 address 0x48" \
    cukinia_i2c 2 0x48


# =============================================================================
cukinia_log "━━━━ 6. IIO — ACCELEROMETER AND GYROSCOPE ━━━━━━━━━━━━━━━━━━━━━"
# =============================================================================

# --- iio:device0 — MMA8451 accelerometer (I2C-2, address 0x1c) ---
# The trikRuntime init script enables all three axes and the hardware trigger
# before starting, so the buffer must already be active when cukinia runs.

as "IIO device0 char device exists (/dev/iio:device0)" \
    cukinia_test -c /dev/iio:device0

as "IIO device0 sysfs directory exists" \
    cukinia_test -d /sys/bus/iio/devices/iio:device0

as "IIO device0 is MMA8451 (accelerometer)" \
    cukinia_cmd grep -q mma8451 /sys/bus/iio/devices/iio:device0/name

as "Accelerometer: X axis enabled in capture buffer" \
    cukinia_cmd grep -q 1 /sys/bus/iio/devices/iio:device0/scan_elements/in_accel_x_en

as "Accelerometer: Y axis enabled in capture buffer" \
    cukinia_cmd grep -q 1 /sys/bus/iio/devices/iio:device0/scan_elements/in_accel_y_en

as "Accelerometer: Z axis enabled in capture buffer" \
    cukinia_cmd grep -q 1 /sys/bus/iio/devices/iio:device0/scan_elements/in_accel_z_en

as "Accelerometer: hardware timestamp enabled in capture buffer" \
    cukinia_cmd grep -q 1 /sys/bus/iio/devices/iio:device0/scan_elements/in_timestamp_en

as "Accelerometer: capture buffer is active (enable=1)" \
    cukinia_cmd grep -q 1 /sys/bus/iio/devices/iio:device0/buffer/enable

# --- iio:device1 — L3GD20? gyroscope (SPI-1, chip spi1.0) ---
# Note: the gyroscope is on SPI, not I2C — do not expect it on any i2c bus.

as "IIO device1 char device exists (/dev/iio:device1)" \
    cukinia_test -c /dev/iio:device1

as "IIO device1 sysfs directory exists" \
    cukinia_test -d /sys/bus/iio/devices/iio:device1

as "IIO device1 is L3GD20H or L3GD20 (gyroscope)" \
    cukinia_cmd grep -qE "l3gd20h|l3gd20" /sys/bus/iio/devices/iio:device1/name

as "Gyroscope: X axis (angular velocity) enabled in capture buffer" \
    cukinia_cmd grep -q 1 /sys/bus/iio/devices/iio:device1/scan_elements/in_anglvel_x_en

as "Gyroscope: Y axis (angular velocity) enabled in capture buffer" \
    cukinia_cmd grep -q 1 /sys/bus/iio/devices/iio:device1/scan_elements/in_anglvel_y_en

as "Gyroscope: Z axis (angular velocity) enabled in capture buffer" \
    cukinia_cmd grep -q 1 /sys/bus/iio/devices/iio:device1/scan_elements/in_anglvel_z_en

as "Gyroscope: hardware timestamp enabled in capture buffer" \
    cukinia_cmd grep -q 1 /sys/bus/iio/devices/iio:device1/scan_elements/in_timestamp_en

as "Gyroscope: capture buffer is active (enable=1)" \
    cukinia_cmd grep -q 1 /sys/bus/iio/devices/iio:device1/buffer/enable


# =============================================================================
cukinia_log "━━━━ 7. PWM CHANNELS ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
# =============================================================================

# PWM chip to servo port mapping (from trikRuntime system config):
#   pwmchip0 (ECAP0)          -> servo S3
#   pwmchip1 (ECAP1)          -> servo S2
#   pwmchip2 (ECAP2)          -> servo S1
#   pwmchip3 (EHRPWM0, ch.1)  -> servo S4
#   pwmchip5 (EHRPWM1, ch.0)  -> servo S5
#   pwmchip5 (EHRPWM1, ch.1)  -> servo S6  (controlMin=0, controlMax=100)
#
# All channels are pre-exported by the trikRuntime init script with
# period = 20 000 000 ns (20 ms — standard RC servo frequency).

as "pwmchip0 (ECAP0) present in sysfs — servo S3" \
    cukinia_test -d /sys/class/pwm/pwmchip0

as "pwmchip1 (ECAP1) present in sysfs — servo S2" \
    cukinia_test -d /sys/class/pwm/pwmchip1

as "pwmchip2 (ECAP2) present in sysfs — servo S1" \
    cukinia_test -d /sys/class/pwm/pwmchip2

as "pwmchip3 (EHRPWM0) present in sysfs — servo S4" \
    cukinia_test -d /sys/class/pwm/pwmchip3

as "pwmchip5 (EHRPWM1) present in sysfs — servos S5/S6" \
    cukinia_test -d /sys/class/pwm/pwmchip5

# Verify that channels are exported and configured with the correct period.
as "pwmchip0/pwm0 exported (servo S3)" \
    cukinia_test -d /sys/class/pwm/pwmchip0/pwm0

as "pwmchip0/pwm0 period is 20 ms (20000000 ns)" \
    cukinia_cmd grep -q 20000000 /sys/class/pwm/pwmchip0/pwm0/period

as "pwmchip1/pwm0 exported (servo S2)" \
    cukinia_test -d /sys/class/pwm/pwmchip1/pwm0

as "pwmchip2/pwm0 exported (servo S1)" \
    cukinia_test -d /sys/class/pwm/pwmchip2/pwm0

as "pwmchip3/pwm1 exported (servo S4)" \
    cukinia_test -d /sys/class/pwm/pwmchip3/pwm1

as "pwmchip5/pwm0 exported (servo S5)" \
    cukinia_test -d /sys/class/pwm/pwmchip5/pwm0

as "pwmchip5/pwm1 exported (servo S6)" \
    cukinia_test -d /sys/class/pwm/pwmchip5/pwm1


# =============================================================================
cukinia_log "━━━━ 8. GPIO ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
# =============================================================================

# The DA850 SoC provides a single GPIO controller with 144 lines.
as "GPIO controller davinci_gpio.0 present (gpiochip0, 144 lines)" \
    cukinia_test -d /sys/class/gpio/gpiochip0

# All pins below are exported by the trikRuntime init script at startup.
# Expected state after boot (from live system report):
#
#   gpio30  out  0   -- purpose TBD
#   gpio35  out  1   -- power rail control
#   gpio36  out  1   -- power rail control
#   gpio37  out  1   -- power rail control
#   gpio56  in   1   -- battery voltage level sense (2S vs 3S LiPo)
#   gpio62  out  1   -- camera power enable
#   gpio94  out  1   -- power rail control

# --- Export check (pin sysfs directory must exist) ---
as "GPIO 30 exported" \
    cukinia_test -d /sys/class/gpio/gpio30

as "GPIO 35 exported" \
    cukinia_test -d /sys/class/gpio/gpio35

as "GPIO 36 exported" \
    cukinia_test -d /sys/class/gpio/gpio36

as "GPIO 37 exported" \
    cukinia_test -d /sys/class/gpio/gpio37

as "GPIO 56 exported (battery voltage level sense)" \
    cukinia_test -d /sys/class/gpio/gpio56

as "GPIO 62 exported (camera power enable)" \
    cukinia_test -d /sys/class/gpio/gpio62

as "GPIO 94 exported" \
    cukinia_test -d /sys/class/gpio/gpio94

# --- Direction check ---
as "GPIO 30: direction is out" \
    cukinia_cmd grep -q out /sys/class/gpio/gpio30/direction

as "GPIO 35: direction is out" \
    cukinia_cmd grep -q out /sys/class/gpio/gpio35/direction

as "GPIO 36: direction is out" \
    cukinia_cmd grep -q out /sys/class/gpio/gpio36/direction

as "GPIO 37: direction is out" \
    cukinia_cmd grep -q out /sys/class/gpio/gpio37/direction

as "GPIO 56: direction is in (reads battery voltage level)" \
    cukinia_cmd grep -q in /sys/class/gpio/gpio56/direction

as "GPIO 62: direction is out" \
    cukinia_cmd grep -q out /sys/class/gpio/gpio62/direction

as "GPIO 94: direction is out" \
    cukinia_cmd grep -q out /sys/class/gpio/gpio94/direction

# --- Value check (expected levels after trikRuntime init) ---
as "GPIO 35: value is HIGH (1)" \
    cukinia_cmd grep -q 1 /sys/class/gpio/gpio35/value

as "GPIO 36: value is HIGH (1)" \
    cukinia_cmd grep -q 1 /sys/class/gpio/gpio36/value

as "GPIO 37: value is HIGH (1)" \
    cukinia_cmd grep -q 1 /sys/class/gpio/gpio37/value

as "GPIO 62: value is HIGH (1) — camera power is ON" \
    cukinia_cmd grep -q 1 /sys/class/gpio/gpio62/value

as "GPIO 94: value is HIGH (1)" \
    cukinia_cmd grep -q 1 /sys/class/gpio/gpio94/value


# =============================================================================
cukinia_log "━━━━ 9. DSP / REMOTEPROC ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
# =============================================================================

# The TI C674x DSP is managed by the da8xx_remoteproc driver.
# It appears as remoteproc0 and must be in "running" state after boot.
# The DSP firmware (rproc-dsp-fw) is loaded from /lib/firmware/ at startup.
# Once running, the DSP communicates with the ARM core via virtio/rpmsg.

as "remoteproc0 sysfs entry exists" \
    cukinia_test -d /sys/class/remoteproc/remoteproc0

as "DSP firmware is loaded and running (state=running)" \
    cukinia_cmd grep -q running /sys/class/remoteproc/remoteproc0/state

as "DSP firmware name is rproc-dsp-fw" \
    cukinia_cmd grep -q rproc-dsp-fw /sys/class/remoteproc/remoteproc0/firmware

as "DSP firmware binary exists in /lib/firmware/" \
    cukinia_test -f /lib/firmware/rproc-dsp-fw

# The MSP430 at 0x48 is the motor controller
as "MSP430 motor controller responds on I2C-2 address 0x48" \
    cukinia_i2c 2 0x48


# =============================================================================
cukinia_log "━━━━ 10. INPUT DEVICES — BUTTONS AND ULTRASONIC SENSORS ━━━━━━━"
# =============================================================================

# Four input event devices are registered at boot:
#   event0 -- GPIO push-buttons (the physical keys on the brick)
#   event1 -- HC-SR04 ultrasonic sensor on port D1 (trik_jd1)
#   event2 -- HC-SR04 ultrasonic sensor on port D2 (trik_jd2)
#   event3 -- HC-SR04 ultrasonic sensor on port D3 (trik_jf1)
#
# trikRuntime references sensors by their stable by-path symlinks,
# not by the raw eventN names, so both the devices and symlinks are checked.

as "event0 character device exists (GPIO buttons)" \
    cukinia_test -c /dev/input/event0

as "event1 character device exists (ultrasonic sensor D1 / trik_jd1)" \
    cukinia_test -c /dev/input/event1

as "event2 character device exists (ultrasonic sensor D2 / trik_jd2)" \
    cukinia_test -c /dev/input/event2

as "event3 character device exists (ultrasonic sensor D3 / trik_jf1)" \
    cukinia_test -c /dev/input/event3

# Stable by-path symlinks — these are the paths used in trikRuntime config.
as "by-path symlink for GPIO buttons points to event0" \
    cukinia_symlink /dev/input/by-path/platform-soc@1c00000:gpio-keys-event /dev/input/event0

as "by-path symlink for D1 sensor (trik_jd1) points to event1" \
    cukinia_symlink /dev/input/by-path/platform-trik_jd1-event /dev/input/event1

as "by-path symlink for D2 sensor (trik_jd2) points to event2" \
    cukinia_symlink /dev/input/by-path/platform-trik_jd2-event /dev/input/event2

as "by-path symlink for D3 sensor (trik_jf1) points to event3" \
    cukinia_symlink /dev/input/by-path/platform-trik_jf1-event /dev/input/event3


# =============================================================================
cukinia_log "━━━━ 11. FILESYSTEM AND DEVICES ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
# =============================================================================

# --- Mount points ---
# Root filesystem is on the SD card partition (ext4, read-write).
as "Root filesystem mounted (ext4)" \
    cukinia_mount /dev/root / ext4

as "/proc mounted (procfs)" \
    cukinia_mount proc /proc proc

as "/sys mounted (sysfs)" \
    cukinia_mount sysfs /sys sysfs

# /run is a tmpfs — holds runtime state (PIDs, FIFOs, sockets).
as "/run mounted (tmpfs)" \
    cukinia_mount tmpfs /run tmpfs

# --- I2C character devices ---
as "/dev/i2c-1 character device exists" \
    cukinia_test -c /dev/i2c-1

as "/dev/i2c-2 character device exists" \
    cukinia_test -c /dev/i2c-2

# --- SPI devices ---
# spi0.0 -- connected to peripheral on SPI bus 0.
as "SPI device spi0.0 present in sysfs" \
    cukinia_test -d /sys/bus/spi/devices/spi0.0

# spi1.0 -- gyroscope on SPI bus 1.
as "SPI device spi1.0 present in sysfs (gyroscope)" \
    cukinia_test -d /sys/bus/spi/devices/spi1.0

# --- Serial ports ---
# ttyS1 is the primary debug/login serial console (115200 baud).
as "/dev/ttyS1 character device exists (debug console)" \
    cukinia_test -c /dev/ttyS1

as "/dev/ttyS2 character device exists" \
    cukinia_test -c /dev/ttyS2

# --- Status LEDs ---
# Two onboard LEDs are controlled via /sys/class/leds/ by trikRuntime.
as "Green status LED present in sysfs (/sys/class/leds/led_green)" \
    cukinia_test -d /sys/class/leds/led_green

as "Red status LED present in sysfs (/sys/class/leds/led_red)" \
    cukinia_test -d /sys/class/leds/led_red

# --- Gamepad FIFO ---
# The gamepad service creates this FIFO at startup; trikRuntime reads from it.
as "Gamepad service output FIFO exists (/run/gamepad-service.out.fifo)" \
    cukinia_test -e /run/gamepad-service.out.fifo

# --- Camera video device ---
# /dev/video0 is created by the ov7670 or UVC driver.
# NOTE: this test will FAIL if no camera is physically connected at boot time.
# Wrap in 'when' if camera presence is optional in your test environment:
#   when "test -e /sys/class/video4linux/video0" cukinia_test -c /dev/video0
as "Camera video device /dev/video0 exists" \
    cukinia_test -c /dev/video0


# =============================================================================
cukinia_log "━━━━ 12. AUDIO ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
# =============================================================================

# ALSA sound card is based on TI DA850 McASP + TLV320AIC3x codec (I2C-2:0x18).
as "ALSA: TRIK sound card registered" \
    cukinia_cmd grep -q TRIK /proc/asound/cards

# PCM directory exists when at least one playback/capture device is registered.
as "ALSA: PCM device file present (/proc/asound/pcm)" \
    cukinia_test -f /proc/asound/pcm


# =============================================================================
cukinia_log "━━━━ 13. USERS AND GROUPS ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
# =============================================================================

# These system accounts must be present for their respective daemons to start.
as "System user 'sshd' exists" \
    cukinia_user sshd

as "System user 'ntp' exists" \
    cukinia_user ntp

as "System user 'avahi' exists" \
    cukinia_user avahi

as "System user 'messagebus' exists (D-Bus)" \
    cukinia_user messagebus

# dialout group membership is required for serial port access (/dev/ttyS*).
as "Group 'dialout' exists" \
    cukinia_group dialout

as "Group 'audio' exists" \
    cukinia_group audio

as "Group 'video' exists" \
    cukinia_group video


