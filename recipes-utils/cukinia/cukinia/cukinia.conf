cukinia_log "━━━━ 14. PYTHON ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
# =============================================================================

# Python 3.10.19 is installed at /usr/bin/python3.
as "Python 3 interpreter is installed (/usr/bin/python3)" \
    cukinia_cmd which python3

